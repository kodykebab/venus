# Fly.io deployment for the ParaCheck CI service.
#
# One machine, one volume. The queue is a table in SQLite on that volume, so the
# machine must not be replaced out from under an in-flight review - hence a
# rolling strategy with a single instance rather than blue-green.

app = "paracheck-ci"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PARACHECK_DB = "/data/paracheck.db"
  PARACHECK_CHAIN = "monad"
  PARACHECK_MIN_SEVERITY = "low"
  # The worker shares this process. Split it into its own [processes] entry when
  # reviews start queueing behind each other.
  PARACHECK_INLINE_WORKER = "1"

[mounts]
  source = "paracheck_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # a stopped machine drains no queue
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    # Webhooks are tiny and must always get a fast 2xx; the real work is queued.
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  # Solidity compilation is memory-hungry; 512MB OOMs on real projects.
  size = "performance-1x"
  memory = "4gb"

[deploy]
  strategy = "rolling"
  # Reviews take minutes. SIGTERM lets the worker finish the job in hand, and
  # anything it doesn't finish stays queued for the new machine.
  wait_timeout = "10m"
