name = "paracheck-control-plane"
main = "src/index.ts"
compatibility_date = "2026-09-21"

[vars]
ENVIRONMENT = "production"
DEMO_ORIGIN = "https://static-ruby-psi.vercel.app"
# Set these to the values from the Clerk JWT template. They are identifiers,
# not secrets; the Clerk private/secret key must never be placed here.
CLERK_JWKS_URL = ""
CLERK_ISSUER = ""
CLERK_AUDIENCE = ""

[[d1_databases]]
binding = "DB"
database_name = "paracheck"
database_id = "96a48c1d-101b-45de-8e53-23a0846afc5e"

# Secrets are set with `wrangler secret put`, never committed:
# CLERK_JWT_KEY
# CLERK_ISSUER
# CLERK_AUDIENCE
# GITHUB_APP_ID
# GITHUB_APP_PRIVATE_KEY
# GITHUB_WEBHOOK_SECRET
# STRIPE_WEBHOOK_SECRET
# ENTERPRISE_SALES_EMAIL
