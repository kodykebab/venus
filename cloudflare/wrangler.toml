name = "paracheck-control-plane"
main = "src/index.ts"
compatibility_date = "2026-09-21"
compatibility_flags = ["nodejs_compat"]

# The control plane. It owns identity, billing, quota and state, and it never
# compiles anything - it never sees customer source at all.
#
# Analysis runs as a GitHub Actions workflow on the customer's own runner. The
# run authenticates back here with a GitHub OIDC token, so there is no secret
# for a customer to configure and no compute for us to operate.

[vars]
ENVIRONMENT = "production"
# Identifiers, not secrets. The Clerk secret key is set with `wrangler secret`.
CLERK_ISSUER = ""
CLERK_AUDIENCE = ""
GITHUB_APP_SLUG = "paracheck-ci"
PUBLIC_URL = "https://paracheck.dev"
ENTERPRISE_SALES_EMAIL = ""

[[d1_databases]]
binding = "DB"
database_name = "paracheck"
database_id = "96a48c1d-101b-45de-8e53-23a0846afc5e"

# Secrets, set with `wrangler secret put` and never committed:
#   CLERK_SECRET_KEY        verifying Clerk sessions
#   GITHUB_APP_ID
#   GITHUB_APP_PRIVATE_KEY  PEM, signs the App JWT
#   GITHUB_WEBHOOK_SECRET   HMAC over every delivery
#   GITHUB_CLIENT_ID
#   GITHUB_CLIENT_SECRET
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_HOBBY_PRICE_ID
#   STRIPE_PRO_PRICE_ID
#   ENCRYPTION_KEY          encrypts stored Anthropic keys at rest

# The Analyzer Durable Object was registered by an earlier attempt at running
# the analysis in a Cloudflare Container. That approach needs a paid Workers
# plan; the analysis now runs in GitHub Actions instead. Cloudflare tracks
# migrations by tag, so removing the class from the config is not enough - it
# has to be deleted explicitly, and v1 stays here as applied history.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Analyzer"]

[[migrations]]
tag = "v2"
deleted_classes = ["Analyzer"]
